experiment: wavlm_base_plus_mean_logistic_reproduction_v2
data:
  manifest: data/manifest.csv
  folds: speaker_folds.json
  expected_recordings: 1200
  expected_speakers: 20
encoder:
  model_id: microsoft/wavlm-base-plus
  revision: 4c66d4806a428f2e922ccfa1a962776e232d487b
  sample_rate: 16000
  expected_layers: 12
  expected_width: 768
  expected_do_normalize: false
  pooling: all_transformer_mean
  device: cpu
classifier:
  name: logistic
  C: 1.0
  max_iter: 2000
runtime:
  seed: 42
  cpu_threads: 4
  smoke_recordings: 5
output:
  directory: artifacts/experiments/wavlm_reproduction_v2
ensemble:
  reference_features: data/reproduction_v2/wav2vec2_all_layers_dev.npz
  candidate_directory: artifacts/experiments/wavlm_reproduction_v2
  reference_weight: 0.5
  candidate_weight: 0.5
  output_directory: artifacts/experiments/ensemble_reproduction_v2
regularization:
  candidates:
  - 0.001
  - 0.01
  - 0.1
  - 1.0
  baseline_C: 1.0
  selection: inner_speaker_folds
  tie_break: smaller_C
  output_directory: artifacts/experiments/regularization_reproduction_v2
fitting:
  output_directory: artifacts/models/equal_ensemble_refactor_v1
